<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간단 메모장</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 16px;font:16px/1.6 system-ui,sans-serif;color:#222;background:#fff}main{max-width:560px;margin:auto}h1{font-size:24px}section{border:1px solid #ddd;border-radius:10px;padding:20px;margin:16px 0}label{display:block;margin-top:12px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #aaa;border-radius:6px}textarea{min-height:120px;resize:vertical}button{padding:9px 15px;margin:10px 6px 0 0;border:1px solid #aaa;border-radius:6px;background:#f6f6f6;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{min-height:26px;overflow-wrap:anywhere}#account{overflow-wrap:anywhere}ul{padding:0;list-style:none}li{padding:16px 0;border-bottom:1px solid #ddd}li p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#666}[hidden]{display:none!important}
</style></head><body><main><h1>간단 메모장</h1><p id="status" role="status" aria-live="polite">연결 중…</p>
<section id="auth" hidden><form id="authform"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required><label for="password">비밀번호</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><button type="submit">로그인</button><button id="signup" type="button">회원가입</button></form></section>
<section id="app" hidden><p id="account"></p><button id="logout" type="button">로그아웃</button><form id="memoform"><label for="content">메모 내용</label><textarea id="content" required></textarea><button type="submit">저장</button></form><h2>내 메모</h2><p id="empty" hidden>저장된 메모가 없습니다.</p><ul id="list"></ul></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let db,user=null,busy=false,version=0;
function status(s){$('status').textContent=s}
function lock(v){busy=v;document.querySelectorAll('button').forEach(b=>b.disabled=v)}
function errorText(e){const m=e.message||String(e);if(m==='Invalid login credentials')return '이메일 또는 비밀번호를 확인해 주세요.';if(m.includes('Email not confirmed'))return '이메일 확인 설정이 필요합니다.';if(m.includes('already registered'))return '이미 가입된 이메일입니다.';return '오류: '+m}
async function run(message,fn){if(busy)return;lock(true);status(message);try{await fn()}catch(e){status(errorText(e))}finally{lock(false)}}
async function loadMemos(){
const token=++version;
const {data,error}=await db.from('memos').select('id,content,created_at').order('created_at',{ascending:false});
if(error)throw error;if(token!==version||!user)return;
$('list').replaceChildren();$('empty').hidden=data.length>0;
for(const memo of data){const li=document.createElement('li'),p=document.createElement('p'),time=document.createElement('small'),b=document.createElement('button');
p.textContent=memo.content;time.textContent=new Date(memo.created_at).toLocaleString('ko-KR');b.textContent='삭제';b.type='button';b.setAttribute('aria-label','메모 삭제');
b.addEventListener('click',()=>run('삭제 중…',async()=>{const {error}=await db.from('memos').delete().eq('id',memo.id);if(error)throw error;await loadMemos();status('삭제했습니다.')}));
li.append(p,time,document.createElement('br'),b);$('list').append(li)}
}
async function showSession(session){user=session?.user||null;$('auth').hidden=!!user;$('app').hidden=!user;$('account').textContent=user?.email||'';if(user){await loadMemos();status('로그인했습니다.')}else{version++;$('list').replaceChildren();$('content').value='';status('로그인해 주세요.')}}
$('authform').addEventListener('submit',e=>{e.preventDefault();run('로그인 중…',async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await showSession(data.session)})});
$('signup').addEventListener('click',()=>{if(!$('authform').reportValidity())return;run('가입 중…',async()=>{const {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!data.session)throw new Error('이메일 확인이 켜져 있습니다. 실습 프로젝트의 Confirm email 설정을 꺼 주세요.');$('password').value='';await showSession(data.session)})});
$('logout').addEventListener('click',()=>run('로그아웃 중…',async()=>{const {error}=await db.auth.signOut();if(error)throw error;await showSession(null)}));
$('memoform').addEventListener('submit',e=>{e.preventDefault();const content=$('content').value.trim();if(!content){status('메모 내용을 입력해 주세요.');return}run('저장 중…',async()=>{if(!user)throw new Error('로그인이 필요합니다.');const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;$('content').value='';await loadMemos();status('저장했습니다.')})});
(async()=>{try{if(!window.supabase)throw new Error('연결 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.');
db=window.supabase.createClient('https://vfuujlhbnlrkhwdookhp.supabase.co','sb_publishable_PFn8g5zY8mrjG5Eu26gJFQ_qjCWJVq0',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||event==='TOKEN_REFRESHED')setTimeout(()=>showSession(session).catch(e=>status(errorText(e))),0)});
const {data,error}=await db.auth.getSession();if(error)throw error;await showSession(data.session)}catch(e){status(errorText(e))}})();
</script></body></html>
